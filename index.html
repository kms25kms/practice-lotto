<style>
  :root {
    --bg: #06070d;
    --text: #f1f2fb;
    --muted: #8d92b3;
    --line: rgba(255, 255, 255, .1);
    --gold: #ffcf3f;
    --win: #39e08a;
    --lose: #ff5c6c;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    word-break: keep-all;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* 상단: 왼쪽 이름, 오른쪽 자금 */
  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
    background: linear-gradient(var(--bg) 40%, transparent);
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .brand { font-weight: 900; font-size: 16px; letter-spacing: -.01em; padding-top: 4px; }
  .wallet { text-align: right; }
  .wallet-row { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .money { font-size: 21px; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .stage { font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 6px; background: rgba(255, 255, 255, .08); color: var(--muted); }
  .stage.up { background: linear-gradient(135deg, #7c3aed, #c084fc); color: #fff; }
  .stage.hot { background: linear-gradient(135deg, #ea580c, #facc15); color: #1a1200; }
  .delta { font-size: 13px; font-weight: 800; height: 18px; opacity: 0; transition: opacity .3s; font-variant-numeric: tabular-nums; }
  .delta.show { opacity: 1; }
  .delta.up { color: var(--win); }
  .delta.down { color: var(--lose); }

  main { width: min(100%, 720px); margin: 0 auto; padding-bottom: 28px; }

  /* 추첨기 */
  .machine {
    position: relative; height: min(68vh, 640px); min-height: 380px;
    background: radial-gradient(ellipse 60% 55% at 50% 45%, rgba(110, 120, 255, .16), transparent 70%);
  }
  .machine canvas { width: 100%; height: 100%; display: block; cursor: pointer; touch-action: manipulation; }
  .sound {
    position: absolute; right: 14px; bottom: 10px; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(10, 12, 24, .7); cursor: pointer; font-size: 15px;
  }
  .machine.grab canvas { cursor: crosshair; }
  .mini { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-weight: 900; font-size: 18px; color: #fff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, .7); opacity: 0; pointer-events: none; transition: opacity .15s; }
  .mini.show { opacity: 1; }
  .hint { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; color: var(--muted); font-size: 13px; pointer-events: none; transition: opacity .4s; }

  /* 뽑힌 번호 */
  .picked { display: flex; justify-content: center; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; }
  .ball {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px; color: #fff;
    box-shadow: inset -3px -4px 8px rgba(0, 0, 0, .25), inset 3px 3px 6px rgba(255, 255, 255, .35);
  }
  .ball.empty { background: transparent; border: 1.5px dashed rgba(255, 255, 255, .18); box-shadow: none; }
  .ball.pop { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { transform: scale(.2); } to { transform: scale(1); } }
  .plus { color: var(--muted); font-weight: 900; }
  .c1 { background: #fbc400; color: #333; }
  .c2 { background: #69c8f2; }
  .c3 { background: #ff7272; }
  .c4 { background: #aaaaaa; }
  .c5 { background: #b0d840; color: #333; }

  /* 아래 조작부 */
  .panel { padding: 14px 16px 0; }
  .result { text-align: center; margin-bottom: 14px; }
  .result .head { font-size: 22px; font-weight: 900; letter-spacing: -.02em; }
  .result .head.win { color: var(--gold); }
  .result .detail { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .result .profit { font-size: 17px; font-weight: 900; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .result .profit.up { color: var(--win); }
  .result .profit.down { color: var(--lose); }
  .result .enh { font-size: 13px; font-weight: 800; color: var(--muted); margin-top: 2px; }
  .chip-btn {
    margin-top: 10px; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255, 159, 28, .5);
    background: rgba(255, 159, 28, .12); color: #ffbe5c; font-weight: 800; font-size: 13.5px; cursor: pointer;
  }

  .count { display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--line); padding: 4px 2px; transition: border-color .2s; }
  .count:focus-within { border-color: var(--gold); }
  .count input { flex: 1; min-width: 0; border: none; background: none; outline: none; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .count span { color: var(--muted); font-weight: 800; }
  .count .cost { font-size: 13px; color: var(--muted); font-weight: 700; white-space: nowrap; }
  .count .cost.warn { color: var(--lose); }
  .presets { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .presets::-webkit-scrollbar { display: none; }
  .presets button {
    flex: none; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
    font-size: 13.5px; font-weight: 800; color: var(--muted); cursor: pointer;
  }
  .presets button:hover { color: var(--text); border-color: rgba(255, 255, 255, .3); }

  .main-btn {
    width: 100%; margin-top: 14px; padding: 17px; border: none; border-radius: 16px; cursor: pointer;
    font-size: 18px; font-weight: 900; color: #1a1200;
    background: linear-gradient(180deg, #ffe27a, var(--gold) 55%, #ff9f1c);
    box-shadow: 0 10px 26px rgba(255, 159, 28, .3);
    transition: transform .08s, filter .2s;
  }
  .main-btn:active { transform: scale(.97); }
  .main-btn:disabled { filter: grayscale(.7) brightness(.55); cursor: default; }
  .main-btn.pull { color: #fff; background: linear-gradient(180deg, #a59cff, #7c6cff); box-shadow: 0 10px 26px rgba(124, 108, 255, .35); }
  .main-btn.bonus { color: #fff; background: linear-gradient(180deg, #ff8a5c, #ff3d5a); box-shadow: 0 10px 26px rgba(255, 61, 90, .35); }
  .skip { display: block; margin: 10px auto 0; border: none; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }

  footer { text-align: center; color: #50547a; font-size: 12px; padding: 22px 16px 30px; }
  footer button { border: none; background: none; color: inherit; text-decoration: underline; cursor: pointer; font-size: 12px; }

  .modal { position: fixed; inset: 0; z-index: 30; background: rgba(3, 4, 10, .82); display: grid; place-items: center; padding: 16px; }
  .modal-box { width: min(100%, 380px); text-align: center; background: #11132a; border: 1px solid var(--line); border-radius: 20px; padding: 26px 22px 22px; }
  .modal-box h2 { margin: 8px 0 6px; font-size: 22px; }
  .modal-box p { margin: 0 0 16px; color: var(--muted); }

  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 25; pointer-events: none; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .ball.pop, .confetti { animation: none; } }
</style>

<body>
<header class="top">
  <div class="brand">🎰 로또 강화</div>
  <div class="wallet">
    <div class="wallet-row"><span class="stage" id="stage" title="연속 흑자 횟수">+0</span><span class="money" id="money">10억원</span></div>
    <div class="delta" id="delta"></div>
  </div>
</header>

<main>
  <div class="machine" id="machine">
    <canvas aria-label="투명한 돔 로또 추첨기"></canvas>
    <div class="hint" id="hint">추첨이 시작되면 날아다니는 공을 눌러 집으세요</div>
    <div class="mini" id="mini"></div>
    <button class="sound" id="sound-btn" type="button" aria-label="소리 켜기/끄기">🔊</button>
  </div>

  <div class="picked" id="picked"></div>

  <div class="panel">
    <div class="result" id="result" hidden></div>
    <div id="buy-row">
      <label class="count">
        <input id="count" type="text" inputmode="numeric" autocomplete="off" value="1,000" aria-label="구매할 로또 장 수">
        <span>장</span>
        <span class="cost" id="cost"></span>
      </label>
      <div class="presets" id="presets">
        <button type="button" data-set="10">10장</button>
        <button type="button" data-set="100">100장</button>
        <button type="button" data-set="1000">1천장</button>
        <button type="button" data-set="10000">1만장</button>
        <button type="button" data-set="100000">10만장</button>
        <button type="button" data-set="max">올인</button>
      </div>
    </div>
    <button class="main-btn" id="main-btn" type="button">추첨 시작</button>

  </div>

<footer>
  실제 로또 확률(1등 8,145,060분의 1)·평균 당첨금·세금으로 계산한 시뮬레이션 · <button type="button" id="reset-btn">처음부터</button>
</footer>
<div id="modal-root"></div>

<script>
(() => {
  'use strict';

  // ───────── 규칙 ─────────
  const START_MONEY = 1_000_000_000;
  const TICKET_PRICE = 1_000;
  const MAX_PER_ROUND = 1_000_000;
  const TOTAL = 8_145_060;
  const WAYS = [0, 1, 6, 228, 11_115, 182_780];
  const RANK_NAMES = ['낙첨', '1등', '2등', '3등', '4등', '5등'];
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rollPrizes() {
    const between = (a, b) => Math.round((a + Math.random() * (b - a)) / 100) * 100;
    return [0, between(1.2e9, 3.2e9), between(4e7, 8e7), between(1.2e6, 2e6), 50_000, 5_000];
  }
  function taxOf(prize) {
    if (prize <= 2_000_000) return 0;
    if (prize <= 300_000_000) return Math.floor(prize * 0.22);
    return Math.floor(300_000_000 * 0.22 + (prize - 300_000_000) * 0.33);
  }

  // ───────── 상태 (이전 버전 진행 상황 그대로 이어짐) ─────────
  const fresh = () => ({ money: START_MONEY, round: 0, stage: 0, bestStage: 0, bestMoney: START_MONEY, tickets: 0, spent: 0, won: 0, firsts: 0, history: [], lastCount: 1000 });
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  let S = Object.assign(fresh(), load('lotto-enhance', {}));

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
  function won(n) {
    const neg = n < 0;
    n = Math.abs(Math.round(n));
    const jo = Math.floor(n / 1e12), eok = Math.floor((n % 1e12) / 1e8), man = Math.floor((n % 1e8) / 1e4), rest = n % 1e4;
    const parts = [];
    if (jo) parts.push(fmt(jo) + '조');
    if (eok) parts.push(fmt(eok) + '억');
    if (man) parts.push(fmt(man) + '만');
    if (rest || !parts.length) parts.push(fmt(rest));
    return (neg ? '-' : '') + parts.join(' ') + '원';
  }
  const signed = (n) => (n > 0 ? '+' : '') + won(n);
  const colorClass = (n) => (n <= 10 ? 'c1' : n <= 20 ? 'c2' : n <= 30 ? 'c3' : n <= 40 ? 'c4' : 'c5');
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

  // ───────── 추첨 계산 ─────────
  function drawWinning() {
    const all = Array.from({ length: 45 }, (_, i) => i + 1);
    for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
    return { nums: all.slice(0, 6).sort((a, b) => a - b), bonus: all[6] };
  }
  function simulate(n) {
    const t1 = WAYS[1], t2 = t1 + WAYS[2], t3 = t2 + WAYS[3], t4 = t3 + WAYS[4], t5 = t4 + WAYS[5];
    const c = [0, 0, 0, 0, 0, 0];
    for (let i = 0; i < n; i++) {
      const r = Math.floor(Math.random() * TOTAL);
      if (r >= t5) continue;
      if (r < t1) c[1]++; else if (r < t2) c[2]++; else if (r < t3) c[3]++; else if (r < t4) c[4]++; else c[5]++;
    }
    c[0] = n - c[1] - c[2] - c[3] - c[4] - c[5];
    return c;
  }
  function play(count) {
    const cost = count * TICKET_PRICE;
    const win = drawWinning();
    const prizes = rollPrizes();
    const counts = simulate(count);
    let gross = 0, tax = 0;
    for (let r = 1; r <= 5; r++) { gross += counts[r] * prizes[r]; tax += counts[r] * taxOf(prizes[r]); }
    const net = gross - tax, profit = net - cost;
    const best = counts.findIndex((c, r) => r > 0 && c > 0);
    const prevStage = S.stage;
    S.round++; S.money += profit; S.tickets += count; S.spent += cost; S.won += net; S.firsts += counts[1];
    S.stage = profit > 0 ? S.stage + 1 : 0;
    S.bestStage = Math.max(S.bestStage, S.stage);
    S.bestMoney = Math.max(S.bestMoney, S.money);
    S.lastCount = count;
    S.history = [{ n: S.round, count, best: Math.max(best, 0), profit, money: S.money }, ...(S.history || [])].slice(0, 30);
    save('lotto-enhance', S);
    return { count, cost, win, prizes, counts, net, profit, best: Math.max(best, 0), prevStage };
  }

  // ───────── 소리 (Web Audio 합성) ─────────
  const Sound = (() => {
    let ctx = null, out = null, noise = null, air = null, last = 0;
    let on = load('lotto-sound-on', true);
    function ensure(create) {
      if (!on) return null;
      if (!ctx && !create) return null;
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        out = ctx.createGain(); out.gain.value = 0.55; out.connect(ctx.destination);
        noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const d = noise.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function env(g, t, peak, a, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
    function burst(t, freq, q, peak, dec) {
      const s = ctx.createBufferSource(); s.buffer = noise; s.playbackRate.value = 0.8 + Math.random() * 0.4;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain(); env(g, t, peak, 0.002, dec);
      s.connect(f).connect(g).connect(out); s.start(t, Math.random() * 0.5, dec + 0.05);
    }
    function tone(t, type, f0, f1, peak, dur) {
      const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
      if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const g = ctx.createGain(); env(g, t, peak, 0.005, dur);
      o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);
    }
    return {
      get on() { return on; },
      toggle() { on = !on; save('lotto-sound-on', on); if (!on) this.air(false); return on; },
      unlock() { ensure(true); },
      click(p) {
        if (!ensure()) return;
        const t = ctx.currentTime;
        if (t - last < 0.028) return;
        last = t;
        burst(t, 2400 + Math.random() * 2600, 9, 0.03 + p * 0.2, 0.03);
      },
      air(state, strong) {
        if (state) {
          if (!ensure()) return;
          if (!air) {
            const s = ctx.createBufferSource(); s.buffer = noise; s.loop = true;
            const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 650;
            const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, ctx.currentTime);
            s.connect(f).connect(g).connect(out); s.start();
            air = { s, f, g };
          }
          const t = ctx.currentTime;
          air.f.frequency.linearRampToValueAtTime(strong ? 1500 : 650, t + 0.4);
          air.g.gain.cancelScheduledValues(t);
          air.g.gain.setValueAtTime(Math.max(air.g.gain.value, 0.0001), t);
          air.g.gain.exponentialRampToValueAtTime(strong ? 0.2 : 0.12, t + 0.4);
        } else if (air && ctx) {
          const a = air; air = null; const t = ctx.currentTime;
          a.g.gain.cancelScheduledValues(t);
          a.g.gain.setValueAtTime(Math.max(a.g.gain.value, 0.0001), t);
          a.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
          a.s.stop(t + 0.65);
        }
      },
      suck() { if (!ensure()) return; const t = ctx.currentTime; tone(t, 'sine', 220, 900, 0.22, 0.25); burst(t, 1200, 2, 0.1, 0.2); },
      roll(sec) {
        if (!ensure()) return;
        const t0 = ctx.currentTime;
        for (let x = 0; x < sec; ) { burst(t0 + x, 900 + x * 500, 3, 0.03 + (x / sec) * 0.05, 0.03); x += 0.05 - (x / sec) * 0.025; }
      },
      clack() { if (!ensure()) return; const t = ctx.currentTime; burst(t, 3200, 6, 0.3, 0.05); tone(t, 'triangle', 1400, 900, 0.06, 0.08); },
      ding(k, bonus) {
        if (!ensure()) return;
        const t = ctx.currentTime, f = bonus ? 1046.5 : [523.3, 587.3, 659.3, 698.5, 784, 880][k] || 880;
        tone(t, 'sine', f, null, 0.18, 0.7); tone(t, 'triangle', f * 2, null, 0.05, 0.4);
      },
      drumroll(sec) {
        if (!ensure()) return;
        const t = ctx.currentTime;
        for (let x = 0; x < sec; ) { burst(t + x, 1400, 1.2, 0.05 + (x / sec) * 0.12, 0.05); x += 0.07 - (x / sec) * 0.035; }
      },
      fanfare(big) {
        if (!ensure()) return;
        const t = ctx.currentTime, notes = big ? [523.3, 659.3, 784, 1046.5, 784, 1046.5, 1318.5] : [659.3, 784, 1046.5];
        notes.forEach((f, i) => tone(t + i * 0.12, 'triangle', f, null, 0.18, big && i === notes.length - 1 ? 1.2 : 0.3));
      },
      thud() { if (!ensure()) return; const t = ctx.currentTime; tone(t, 'sine', 180, 55, 0.4, 0.5); burst(t, 300, 1, 0.15, 0.2); },
    };
  })();

  // ───────── 3D 돔 추첨기 ─────────
  function createMachine(THREE, RoomEnvironment, box) {
    const canvas = box.querySelector('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.NeutralToneMapping;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const R = 1.6, BALL = 0.2, INNER = R - BALL - 0.03;
    const RAIL_Y = -R - 0.36, RAIL_Z = 1.7, RAIL_X0 = 2.05;
    const slotX = (k) => -1.78 + k * 0.44 + (k === 6 ? 0.26 : 0);
    const UP = new THREE.Vector3(0, 1, 0);
    const FACE = new THREE.Quaternion(); // 숫자가 앞뒤(+z, -z)에 있어서 기본 방향이 정면

    // 유리 돔 (빛이 굴절되는 진짜 유리 재질)
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(R, 96, 64),
      new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.02, transmission: 1, thickness: 0.12, ior: 1.42, clearcoat: 1, clearcoatRoughness: 0.03, specularIntensity: 1 })
    );
    scene.add(dome);
    const backWall = new THREE.Mesh(
      new THREE.SphereGeometry(R - 0.01, 64, 48),
      new THREE.MeshPhysicalMaterial({ color: 0xbfc8ff, transparent: true, opacity: 0.05, roughness: 0.1, side: THREE.BackSide, depthWrite: false })
    );
    scene.add(backWall);

    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xdbe4ff, transparent: true, opacity: 0.09, roughness: 0.04, clearcoat: 1, depthWrite: false, side: THREE.DoubleSide });
    const gold = new THREE.MeshPhysicalMaterial({ color: 0xffcf3f, metalness: 1, roughness: 0.25 });
    const steel = new THREE.MeshPhysicalMaterial({ color: 0x23284d, metalness: 0.8, roughness: 0.3 });

    // 받침대 + 바람 나오는 고리
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 1.2, 0.55, 64), steel);
    base.position.y = -R - 0.2;
    const collar = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.05, 16, 96), gold);
    collar.rotation.x = Math.PI / 2;
    collar.position.y = -R + 0.08;
    const airRing = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.04, 12, 64), new THREE.MeshStandardMaterial({ color: 0x66e0ff, emissive: 0x33ccff, emissiveIntensity: 0.3 }));
    airRing.rotation.x = Math.PI / 2;
    airRing.position.y = -R + 0.12;
    scene.add(base, collar, airRing);

    // 위쪽 흡입구 + 관
    const funnel = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.55, 0.32, 40, 1, true), glassMat);
    funnel.position.y = R - 0.26;
    const pipeH = 1.05;
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, pipeH, 32, 1, true), glassMat);
    pipe.position.y = R - 0.08 + pipeH / 2;
    const topCap = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.03, 12, 40), gold);
    topCap.rotation.x = Math.PI / 2;
    topCap.position.y = R - 0.06;
    scene.add(funnel, pipe, topCap);

    // 관 끝에서 앞쪽 받침대로 굴러 내려오는 미끄럼틀
    const TOP = new THREE.Vector3(0, R + 0.95, 0);
    const chute = new THREE.CatmullRomCurve3([
      TOP.clone(),
      new THREE.Vector3(0.3, R + 1.22, 0.05),
      new THREE.Vector3(1.05, R + 1.18, 0.35),
      new THREE.Vector3(1.95, R * 0.5, 0.85),
      new THREE.Vector3(2.35, -0.45, 1.35),
      new THREE.Vector3(2.25, RAIL_Y + 0.25, 1.66),
      new THREE.Vector3(RAIL_X0, RAIL_Y, RAIL_Z),
    ], false, 'centripetal');
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(chute, 160, 0.25, 20, false), glassMat));

    // 받침대 레일 (뽑힌 공이 한 줄로 쌓임)
    const RAIL_END = slotX(0) - BALL - 0.04;
    const railLen = RAIL_X0 - RAIL_END;
    for (const dz of [-0.13, 0.13]) {
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, railLen, 12), gold);
      rod.rotation.z = Math.PI / 2;
      rod.position.set((RAIL_X0 + RAIL_END) / 2, RAIL_Y - BALL * 0.75, RAIL_Z + dz);
      scene.add(rod);
    }
    const stopper = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), gold);
    stopper.position.set(RAIL_END, RAIL_Y - BALL * 0.5, RAIL_Z);
    scene.add(stopper);

    // 조명
    const key = new THREE.DirectionalLight(0xffffff, 1.6);
    key.position.set(3, 6, 7);
    const fill = new THREE.PointLight(0x9fa8ff, 8, 14);
    fill.position.set(-3, 1, 4);
    const glow = new THREE.PointLight(0xffcf3f, 4, 10);
    glow.position.set(0, -0.5, 2.8);
    scene.add(key, fill, glow);

    // 공 45개
    function ballTexture(n) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = ['#fbc400', '#69c8f2', '#ff7272', '#aaaaaa', '#b0d840'][Math.min(4, Math.floor((n - 1) / 10))];
      g.fillRect(0, 0, 512, 256);
      // 구에 감기면 가로로 늘어나므로 가로를 절반으로 그려 둥글게 보이게. 앞(+z)·뒤(-z) 두 군데
      for (const cx of [128, 384]) {
        g.save(); g.translate(cx, 128); g.scale(0.5, 1);
        g.fillStyle = '#fff'; g.beginPath(); g.arc(0, 0, 104, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#16161f'; g.font = `bold ${n >= 10 ? 118 : 132}px Arial, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(String(n), 0, 8);
        g.restore();
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 4;
      return t;
    }
    const ballGeo = new THREE.SphereGeometry(BALL, 40, 28);
    const balls = [];
    const randomInside = (topHalf) => {
      const v = new THREE.Vector3();
      do { v.set(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1); } while (v.lengthSq() > 1);
      v.multiplyScalar(INNER * 0.9);
      v.y = topHalf ? Math.abs(v.y) * 0.8 : -Math.abs(v.y);
      return v;
    };
    for (let n = 1; n <= 45; n++) {
      const mesh = new THREE.Mesh(ballGeo, new THREE.MeshPhysicalMaterial({ map: ballTexture(n), roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.06 }));
      mesh.quaternion.setFromEuler(new THREE.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6));
      scene.add(mesh);
      const p = randomInside(false);
      mesh.position.copy(p);
      balls.push({ n, mesh, p, v: new THREE.Vector3(), state: 'live', anim: null });
    }

    let mixing = false, turbo = false, shake = 0, impact = 0, airGlow = 0, level = 0, timeScale = 1, hovered = null;
    const d = new THREE.Vector3(), tmp = new THREE.Vector3(), axis = new THREE.Vector3(), prev = new THREE.Vector3();

    function rollMesh(mesh, delta) {
      const len = delta.length();
      if (len < 1e-5) return;
      axis.crossVectors(UP, delta);
      if (axis.lengthSq() < 1e-8) axis.set(1, 0, 0);
      axis.normalize();
      mesh.rotateOnWorldAxis(axis, len / BALL);
    }

    function physics(dt) {
      const live = balls.filter((b) => b.state === 'live');
      for (const b of live) {
        b.v.y -= 9.8 * dt;
        if (mixing) {
          // 바닥 근처에서 불규칙하게 툭툭 쳐올리는 돌풍 → 공이 돔 전체로 솟구쳤다 떨어짐
          const h = (b.p.y + INNER) / (2 * INNER);                  // 0: 바닥 ~ 1: 꼭대기
          const power = turbo ? 1.5 : 1 + level * 0.1;
          if (h < 0.32 && Math.random() < 14 * power * dt) {
            b.v.y += (6 + Math.random() * 5) * Math.min(power, 1.3);
            b.v.x += (Math.random() - 0.5) * 4 * power;
            b.v.z += (Math.random() - 0.5) * 4 * power;
          }
          b.v.x += (Math.random() - 0.5) * 20 * dt;
          b.v.y += (Math.random() - 0.5) * 20 * dt;
          b.v.z += (Math.random() - 0.5) * 20 * dt;
        }
        b.v.multiplyScalar(1 - 0.1 * dt);
        if (b.v.length() > 12 + level) b.v.setLength(12 + level);
        b.p.addScaledVector(b.v, dt);
        const len = b.p.length();
        if (len > INNER) {
          d.copy(b.p).divideScalar(len);
          b.p.copy(d).multiplyScalar(INNER);
          const vn = b.v.dot(d);
          if (vn > 0) {
            b.v.addScaledVector(d, -1.8 * vn);
            b.v.multiplyScalar(0.985);
            if (vn > 1.5) impact = Math.max(impact, vn);
          }
        }
      }
      const min = BALL * 2;
      for (let i = 0; i < live.length; i++) {
        const a = live[i];
        for (let j = i + 1; j < live.length; j++) {
          const b = live[j];
          d.subVectors(b.p, a.p);
          const dist2 = d.lengthSq();
          if (dist2 >= min * min || dist2 === 0) continue;
          const dist = Math.sqrt(dist2);
          d.divideScalar(dist);
          const push = (min - dist) / 2;
          a.p.addScaledVector(d, -push);
          b.p.addScaledVector(d, push);
          const rel = tmp.subVectors(b.v, a.v).dot(d);
          if (rel < 0) {
            if (-rel > 1.3) impact = Math.max(impact, -rel);
            const imp = -rel * 0.92;
            a.v.addScaledVector(d, -imp);
            b.v.addScaledVector(d, imp);
          }
        }
      }
      for (const b of live) {
        tmp.subVectors(b.p, b.mesh.position);
        rollMesh(b.mesh, tmp);
        b.mesh.position.copy(b.p);
      }
    }

    // 뽑힌 공: 빨려 올라감 → 관 → 미끄럼틀 → 레일의 자기 자리
    const easeIn = (x) => x * x;
    const easeInOut = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
    const easeOutBack = (x) => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
    const INTAKE = new THREE.Vector3(0, R - 0.3, 0);
    function animatePulled(dt) {
      for (const b of balls) {
        const a = b.anim;
        if (!a) continue;
        a.t += dt;
        prev.copy(b.mesh.position);
        if (a.flash > 0) {
          a.flash = Math.max(0, a.flash - dt * 1.6);
          b.mesh.material.emissiveIntensity = a.flash;
        }
        if (a.phase === 'suck') {
          const k = Math.min(1, a.t / 0.42), e = easeIn(k), u = 1 - e;
          // 2차 베지어: 현재 위치 → 위쪽 → 흡입구
          b.mesh.position.set(
            u * u * a.from.x + 2 * u * e * a.ctrl.x + e * e * INTAKE.x,
            u * u * a.from.y + 2 * u * e * a.ctrl.y + e * e * INTAKE.y,
            u * u * a.from.z + 2 * u * e * a.ctrl.z + e * e * INTAKE.z
          );
          if (k >= 1) { a.phase = 'rise'; a.t = 0; }
        } else if (a.phase === 'rise') {
          const k = Math.min(1, a.t / 0.38);
          b.mesh.position.lerpVectors(INTAKE, TOP, easeInOut(k));
          if (k >= 1) { a.phase = 'chute'; a.t = 0; a.cb.roll && a.cb.roll(1.05); }
        } else if (a.phase === 'chute') {
          const k = Math.min(1, a.t / 1.05);
          const u = k * k * 0.55 + k * 0.45;                     // 내려갈수록 빨라짐
          chute.getPointAt(Math.min(1, u), b.mesh.position);
          if (k >= 1) { a.phase = 'rail'; a.t = 0; a.railDur = 0.25 + (RAIL_X0 - slotX(a.slot)) * 0.17; }
        } else if (a.phase === 'rail') {
          const k = Math.min(1, a.t / a.railDur);
          const x = RAIL_X0 + (slotX(a.slot) - RAIL_X0) * easeOutBack(k);
          b.mesh.position.set(x, RAIL_Y, RAIL_Z);
          if (k > 0.55) b.mesh.quaternion.slerp(FACE, Math.min(1, (k - 0.55) * 2.6));
          if (k >= 1) {
            b.mesh.quaternion.copy(FACE);
            b.mesh.material.emissiveIntensity = 0;
            b.anim = null;
            b.state = 'tray';
            shake = Math.max(shake, 0.25);
            a.cb.done && a.cb.done();
            continue;
          }
        }
        if (a.phase !== 'rail' || a.t < a.railDur * 0.55) {
          tmp.subVectors(b.mesh.position, prev);
          rollMesh(b.mesh, tmp);
        }
      }
    }

    // 화면에서 손가락(마우스) 위치와 가장 가까운 공 찾기 — 움직이는 공을 집기 쉽게 판정을 넉넉하게
    const proj = new THREE.Vector3();
    function nearestBall(x, y) {
      const rect = canvas.getBoundingClientRect();
      const tan = Math.tan((camera.fov * Math.PI) / 360);
      let best = null, bestScore = Infinity;
      for (const b of balls) {
        if (b.state !== 'live') continue;
        proj.copy(b.mesh.position).project(camera);
        const sx = rect.left + ((proj.x + 1) / 2) * rect.width;
        const sy = rect.top + ((1 - proj.y) / 2) * rect.height;
        const depth = camera.position.distanceTo(b.mesh.position);
        const radius = (BALL / (depth * tan)) * (rect.height / 2);
        const reach = Math.max(radius * 1.8, 24);
        const dist = Math.hypot(sx - x, sy - y);
        if (dist > reach) continue;
        const score = dist / reach + depth * 0.02;          // 가깝고, 앞쪽에 있는 공 우선
        if (score < bestScore) { bestScore = score; best = b; }
      }
      return best;
    }

    let onImpact = null, visible = true;
    const basePos = new THREE.Vector3();
    function fit() {
      const w = box.clientWidth, h = box.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const xMin = -2.15, xMax = 2.6, yMin = RAIL_Y - 0.5, yMax = R + 1.5;
      const cx = (xMin + xMax) / 2, cy = (yMin + yMax) / 2;
      const halfW = ((xMax - xMin) / 2) * 1.05, halfH = ((yMax - yMin) / 2) * 1.04;
      const tan = Math.tan((camera.fov * Math.PI) / 360);
      const dist = Math.max(halfH / tan, halfW / (tan * camera.aspect)) + 1.2;
      basePos.set(cx, cy + 0.9, 0.4 + dist);
      camera.position.copy(basePos);
      camera.lookAt(cx, cy, 0.4);
      camera.updateProjectionMatrix();
    }

    const api = {
      onPointer: null,
      level(n) { level = n; },
      slowmo() { timeScale = 0.3; },
      canGrab() { return !balls.some((b) => b.anim && (b.anim.phase === 'suck' || b.anim.phase === 'rise')); },
      liveNumbers() { return balls.filter((b) => b.state === 'live').map((b) => b.n); },
      pickAt(x, y) { const b = nearestBall(x, y); return b ? b.n : null; },
      hover(x, y) {
        const b = x == null ? null : nearestBall(x, y);
        if (hovered && hovered !== b && hovered.state === 'live') hovered.mesh.scale.setScalar(1);
        hovered = b;
        if (b) b.mesh.scale.setScalar(1.25);
      },
      set onImpact(fn) { onImpact = fn; },
      mix(on) { mixing = on; if (!on) turbo = false; },
      turbo(on) { turbo = on; },
      stir() {
        for (const b of balls) if (b.state === 'live') b.v.add(tmp.set((Math.random() - 0.5) * 6, 4 + Math.random() * 6, (Math.random() - 0.5) * 6));
        shake = Math.max(shake, 0.35);
        airGlow = 1;
      },
      // n번 공을 slot번째 자리로
      pull(n, slot, cb) {
        const b = balls.find((x) => x.n === n);
        if (!b || b.state !== 'live') { cb.done && cb.done(); return; }
        b.state = 'pulling';
        b.mesh.scale.setScalar(1);
        if (hovered === b) hovered = null;
        b.mesh.material.emissive.setHex(0xffffff);
        b.anim = { phase: 'suck', t: 0, flash: 0.9, from: b.mesh.position.clone(), ctrl: new THREE.Vector3(b.p.x * 0.4, Math.max(b.p.y, 0.6), b.p.z * 0.4), slot, cb };
        shake = Math.max(shake, 0.3);
      },
      reset() {
        level = 0;
        for (const b of balls) {
          b.mesh.scale.setScalar(1);
          b.mesh.material.emissiveIntensity = 0;
          if (b.state === 'live') continue;
          b.state = 'live';
          b.anim = null;
          b.p.copy(randomInside(true));
          b.v.set((Math.random() - 0.5) * 2, -1, (Math.random() - 0.5) * 2);
          b.mesh.position.copy(b.p);
        }
      },
      finishAll(order) {
        order.forEach((n, k) => {
          const b = balls.find((x) => x.n === n);
          if (!b) return;
          b.anim = null;
          b.state = 'tray';
          b.mesh.scale.setScalar(1);
          b.mesh.material.emissiveIntensity = 0;
          b.mesh.position.set(slotX(k), RAIL_Y, RAIL_Z);
          b.mesh.quaternion.copy(FACE);
        });
        mixing = false;
      },
    };

    canvas.addEventListener('pointerdown', (e) => api.onPointer && api.onPointer(e));
    new ResizeObserver(fit).observe(box);
    new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(box);
    fit();

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const raw = Math.min(clock.getDelta(), 0.1);       // 화면이 느려도 실제 시간 기준으로 진행
      timeScale += (1 - timeScale) * Math.min(1, raw * 3);
      const dt = raw * timeScale;
      if (!visible && !balls.some((b) => b.anim)) return;
      impact = 0;
      const steps = Math.min(8, Math.max(2, Math.ceil(dt / (1 / 150))));
      for (let i = 0; i < steps; i++) physics(dt / steps);
      if (impact > 0 && onImpact) onImpact(Math.min(1, impact / 8));
      animatePulled(dt);
      airGlow += ((mixing ? (turbo ? 2.5 : 1.4) : 0.15) - airGlow) * Math.min(1, dt * 4);
      airRing.material.emissiveIntensity = 0.3 + airGlow * 1.6;
      glow.intensity = 4 + airGlow * 3;
      shake = Math.max(0, shake - dt * 2.5);
      camera.position.set(
        basePos.x + (Math.random() - 0.5) * shake * 0.12,
        basePos.y + (Math.random() - 0.5) * shake * 0.12,
        basePos.z
      );
      renderer.render(scene, camera);
    });

    return api;
  }

  // ───────── 화면 ─────────
  let machine = null, phase = 'idle', drawState = null;

  const parseCount = () => { const n = parseInt(String($('count').value).replace(/[^\d]/g, ''), 10); return Number.isFinite(n) ? n : 0; };
  const maxAffordable = () => Math.min(MAX_PER_ROUND, Math.floor(S.money / TICKET_PRICE));
  function setCount(n) {
    n = Math.max(0, Math.min(n, MAX_PER_ROUND));
    $('count').value = n ? fmt(n) : '';
    renderButton();
  }

  function renderPicked(order, shown) {
    const cells = [];
    for (let k = 0; k < 7; k++) {
      if (k === 6) cells.push('<span class="plus">+</span>');
      const n = order && shown[k] ? order[k] : null;
      cells.push(n ? `<div class="ball ${colorClass(n)}${shown[k] === 'new' ? ' pop' : ''}">${n}</div>` : '<div class="ball empty"></div>');
    }
    $('picked').innerHTML = cells.join('');
  }

  function renderButton() {
    const btn = $('main-btn');
    btn.classList.remove('pull', 'bonus');
    if (phase === 'drawing') {
      const st = drawState, k = st.order.length;
      btn.classList.add(k === 6 ? 'bonus' : 'pull');
      if (!machine) {
        btn.textContent = k === 6 ? '⭐ 보너스 공 뽑기' : `🎱 공 뽑기 (${k + 1}/7)`;
        btn.disabled = st.busy || k >= 7;
        return;
      }
      btn.textContent = !st.ready ? '🌀 섞는 중…'
        : k >= 7 ? '결과 확인 중…'
        : k === 6 ? '⭐ 마지막! 보너스 공을 집으세요'
        : `👆 움직이는 공을 눌러 집으세요 (${k + 1}/7)`;
      btn.disabled = true;
      return;
    }
    const n = parseCount();
    const over = n * TICKET_PRICE > S.money;
    const cost = $('cost');
    cost.textContent = over ? `최대 ${fmt(maxAffordable())}장` : won(n * TICKET_PRICE);
    cost.classList.toggle('warn', over);
    btn.textContent = n >= 1 ? `${fmt(n)}장 사고 추첨 시작` : '몇 장 살지 정해주세요';
    btn.disabled = n < 1 || over;
  }

  let shownMoney = S.money;
  function renderWallet(delta) {
    const st = $('stage');
    st.textContent = '+' + S.stage;
    st.className = 'stage' + (S.stage >= 5 ? ' hot' : S.stage >= 1 ? ' up' : '');
    const to = S.money, from = shownMoney;
    shownMoney = to;
    if (delta && !REDUCE) {
      const t0 = performance.now(), dur = Math.abs(delta) > 1e9 ? 2000 : 1100;
      const step = (now) => {
        const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        $('money').textContent = won(from + (to - from) * e);
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    } else {
      $('money').textContent = won(to);
    }
    const d = $('delta');
    if (delta) { d.textContent = signed(delta); d.className = 'delta show ' + (delta > 0 ? 'up' : 'down'); }
    else d.className = 'delta';
  }

  function renderResult(r) {
    const hits = [1, 2, 3, 4, 5].filter((k) => r.counts[k]).map((k) => `${RANK_NAMES[k]} ${fmt(r.counts[k])}장`);
    const head = r.best === 1 ? '🎉 1등 당첨!' : r.best === 2 ? '2등 당첨!' : r.best === 3 ? '3등 당첨!' : r.best ? '아깝다…' : '전부 꽝';
    const detail = r.best ? hits.join(' · ') : `${fmt(r.count)}장 모두 낙첨`;
    const reinvest = Math.min(MAX_PER_ROUND, Math.floor(Math.min(r.net, S.money) / TICKET_PRICE));
    const enh = r.profit > 0 ? `⚔️ 강화 성공 +${r.prevStage} → +${S.stage}`
      : r.prevStage ? `💔 강화 실패 +${r.prevStage} → +0`
      : `당첨금(세후) ${won(r.net)} · 구매 ${won(r.cost)}`;
    $('result').innerHTML = `
      <div class="head ${r.best && r.best <= 3 ? 'win' : ''}">${head}</div>
      <div class="detail">${detail}</div>
      <div class="profit ${r.profit > 0 ? 'up' : 'down'}">${signed(r.profit)}</div>
      <div class="enh">${enh}</div>
      ${r.net >= TICKET_PRICE && reinvest >= 1 ? `<button class="chip-btn" type="button" data-reinvest="${reinvest}">🔥 당첨금 전부 걸기 (${fmt(reinvest)}장)</button>` : ''}`;
    $('result').hidden = false;
  }

  function confetti(n) {
    const colors = ['#fbc400', '#69c8f2', '#ff7272', '#b0d840', '#c084fc', '#fff'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = pick(colors);
      c.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
      c.style.animationDelay = Math.random() * 0.3 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4200);
    }
  }

  // ───────── 진행 ─────────
  let miniTimer = null;
  function mini(text) {
    const el = $('mini');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(miniTimer);
    miniTimer = setTimeout(() => el.classList.remove('show'), 650);
  }

  function startDraw(count) {
    count = Math.min(count, maxAffordable());
    if (count < 1 || phase !== 'idle') return;
    Sound.unlock();
    setCount(count);
    const r = play(count);
    phase = 'drawing';
    drawState = { r, order: [], arrived: 0, shown: [], ready: false, busy: false };
    $('result').hidden = true;
    $('buy-row').hidden = true;
    $('skip').hidden = false;
    $('hint').style.opacity = 0;
    $('delta').className = 'delta';
    renderPicked(null, []);
    if (machine) { machine.reset(); machine.mix(true); $('machine').classList.add('grab'); }
    Sound.air(true);
    renderButton();
    drawState.readyTimer = setTimeout(() => { drawState.ready = true; renderButton(); }, machine ? 1200 : 100);
    $('machine').scrollIntoView({ behavior: REDUCE ? 'auto' : 'smooth', block: 'start' });
  }

  // k번째로 집은 공이 받침대에 도착
  function arrive(st, k) {
    if (phase !== 'drawing' || drawState !== st) return;
    const bonus = k === 6;
    st.shown[k] = 'new';
    renderPicked(st.order, st.shown);
    st.shown[k] = true;
    Sound.clack();
    Sound.ding(k, bonus);
    buzz(bonus ? [30, 40, 60] : 20);
    st.arrived++;
    st.busy = false;
    if (st.arrived >= 7) setTimeout(finishDraw, 450);
    renderButton();
  }

  // 공 하나 집기 (n번 공)
  function grab(n) {
    const st = drawState;
    const k = st.order.length;
    st.order.push(n);
    st.busy = true;
    Sound.suck();
    buzz(25);
    if (machine) {
      if (k === 6) { machine.turbo(false); Sound.air(true, false); }
      machine.slowmo();
      machine.pull(n, k, { roll: (sec) => Sound.roll(sec), done: () => arrive(st, k) });
      machine.level(k + 1);                                  // 집을수록 더 빨리 돈다
      if (k === 5) {
        // 마지막 보너스 공은 터보 바람 속에서
        setTimeout(() => {
          if (drawState !== st || phase !== 'drawing') return;
          machine.turbo(true);
          Sound.air(true, true);
          Sound.drumroll(0.9);
          mini('⭐ 보너스!');
        }, 700);
      }
    } else {
      setTimeout(() => arrive(st, k), 250);
    }
    renderButton();
  }

  function onMachinePointer(e) {
    Sound.unlock();
    if (phase === 'idle') { machine.stir(); buzz(10); return; }
    const st = drawState;
    if (!st.ready) { mini('🌀 섞는 중…'); return; }
    if (st.order.length >= 7) return;
    if (!machine.canGrab()) return;
    const n = machine.pickAt(e.clientX, e.clientY);
    if (n == null) { mini('빗나감!'); Sound.click(0.3); return; }
    grab(n);
  }

  function autoFill() {
    const st = drawState;
    const pool = machine ? machine.liveNumbers() : Array.from({ length: 45 }, (_, i) => i + 1).filter((n) => !st.order.includes(n));
    while (st.order.length < 7) st.order.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    finishDraw();
  }

  function finishDraw() {
    if (phase !== 'drawing') return;
    const st = drawState;
    clearTimeout(st.readyTimer);
    if (st.order.length < 7) return autoFill();
    st.order.forEach((_, k) => { if (!st.shown[k]) st.shown[k] = 'new'; });
    renderPicked(st.order, st.shown);
    if (machine) { machine.finishAll(st.order); machine.mix(false); machine.hover(null); $('machine').classList.remove('grab'); }
    Sound.air(false);
    phase = 'idle';
    const r = st.r;
    r.win = { nums: st.order.slice(0, 6).sort((a, b) => a - b), bonus: st.order[6] };
    renderWallet(r.profit);
    renderResult(r);
    $('buy-row').hidden = false;
    $('skip').hidden = true;
    if (parseCount() > maxAffordable()) setCount(maxAffordable());
    renderButton();
    if (r.best === 1) { confetti(90); Sound.fanfare(true); buzz([100, 50, 100, 50, 300]); }
    else if (r.profit > 0) { confetti(28); Sound.fanfare(false); buzz([40, 30, 80]); }
    else { Sound.thud(); buzz(100); }
    if (S.money < TICKET_PRICE) setTimeout(showBankrupt, 900);
  }

  function showBankrupt() {
    const rate = S.spent ? ((S.won / S.spent) * 100).toFixed(1) : '0';
    $('modal-root').innerHTML = `
      <div class="modal"><div class="modal-box">
        <div style="font-size:44px">💸</div>
        <h2>파산했습니다</h2>
        <p>${S.round}회차 동안 ${won(S.spent)}을 쓰고<br>${won(S.won)}을 돌려받았어요 (회수율 ${rate}%)<br>최고 자산 ${won(S.bestMoney)}</p>
        <button class="main-btn" type="button" data-restart>다시 10억으로 시작</button>
      </div></div>`;
  }

  function restart() {
    S = fresh();
    save('lotto-enhance', S);
    shownMoney = S.money;
    $('modal-root').innerHTML = '';
    $('result').hidden = true;
    renderWallet();
    renderPicked(null, []);
    if (machine) machine.reset();
    $('hint').style.opacity = 1;
    setCount(1000);
  }

  // ───────── 이벤트 ─────────
  $('main-btn').addEventListener('click', () => {
    if (phase === 'drawing') {
      // 3D를 못 쓰는 환경: 버튼으로 무작위 뽑기
      if (!machine && drawState.ready && !drawState.busy && drawState.order.length < 7) {
        const pool = Array.from({ length: 45 }, (_, i) => i + 1).filter((n) => !drawState.order.includes(n));
        grab(pool[Math.floor(Math.random() * pool.length)]);
      }
    } else startDraw(parseCount());
  });
  $('skip').addEventListener('click', () => { if (phase === 'drawing') autoFill(); });
  $('count').addEventListener('input', () => {
    const n = parseCount();
    $('count').value = n ? fmt(Math.min(n, MAX_PER_ROUND)) : '';
    renderButton();
  });
  $('presets').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) setCount(b.dataset.set === 'max' ? maxAffordable() : Number(b.dataset.set));
  });
  $('result').addEventListener('click', (e) => {
    const b = e.target.closest('[data-reinvest]');
    if (b) startDraw(Number(b.dataset.reinvest));
  });
  $('modal-root').addEventListener('click', (e) => { if (e.target.closest('[data-restart]')) restart(); });
  $('reset-btn').addEventListener('click', () => { if (phase === 'idle' && confirm('10억으로 처음부터 다시 시작할까요?')) restart(); });
  $('sound-btn').addEventListener('click', () => {
    Sound.toggle();
    Sound.unlock();
    $('sound-btn').textContent = Sound.on ? '🔊' : '🔇';
    if (Sound.on && phase === 'drawing') Sound.air(true);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== ' ' && e.key !== 'Enter') return;
    if (e.target.closest('button')) return;              // 버튼에 포커스가 있으면 브라우저 기본 동작에 맡김
    if (e.target.closest('input') && e.key === ' ') return;
    e.preventDefault();
    if (!$('main-btn').disabled) $('main-btn').click();
  });

  // ───────── 시작 ─────────
  $('sound-btn').textContent = Sound.on ? '🔊' : '🔇';
  renderWallet();
  renderPicked(null, []);
  setCount(Math.min(S.lastCount || 1000, maxAffordable()) || 0);
  if (S.money < TICKET_PRICE) showBankrupt();

  if (!REDUCE) {
    Promise.all([import('three'), import('three/addons/environments/RoomEnvironment.js')])
      .then(([THREE, env]) => {
        try {
          machine = createMachine(THREE, env.RoomEnvironment, $('machine'));
          machine.onImpact = (p) => Sound.click(p);
          machine.onPointer = onMachinePointer;
          const cv = $('machine').querySelector('canvas');
          cv.addEventListener('pointermove', (e) => {
            if (e.pointerType === 'mouse' && phase === 'drawing' && drawState.ready && drawState.order.length < 7) machine.hover(e.clientX, e.clientY);
            else machine.hover(null);
          });
          cv.addEventListener('pointerleave', () => machine.hover(null));
        } catch (err) {
          $('machine').hidden = true;
        }
      })
      .catch(() => { $('machine').hidden = true; });
  } else {
    $('machine').hidden = true;
  }
})();
</script>
</body>
</html>
